# Netlify Configuration for Best Food In Multan (Vite + React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) redirect rule
# Ensures refreshing or accessing sub-routes redirects to index.html without 404s
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Global security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Aggressive caching for hashed static build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
